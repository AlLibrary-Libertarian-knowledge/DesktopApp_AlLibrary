[package]
name = "desktopapp_allibrary"
version = "1.0.2"
default-run = "desktopapp_allibrary"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktopapp_allibrary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "tracker"
path = "src/bin/tracker.rs"

[[bin]]
name = "desktopapp_allibrary"
path = "src/main.rs"


[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.10", features = [] }
tokio = { version = "1.0", features = ["full"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.21"
md5 = "0.7"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# File handling
mime_guess = "2.0"

# Streaming and async utilities
async-stream = "0.3"
async-trait = "0.1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }

# Security dependencies
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
local-ip-address = "0.6"
dns-lookup = "2.0"

# System information
sysinfo = "0.30"
dirs = "5.0"

# Tauri plugins
tauri-plugin-opener = "2.5"
pdfium-render = { version = "0.8" }
png = "0.17"
rfd = "0.14"
zip = "0.6"
lopdf = "0.32"

# onion_share (vendored from onion-poc, MIT)
axum = { version = "0.7", features = ["json", "ws"] }
tower = "0.4"
bytes = "1"
memmap2 = "0.9"
chacha20poly1305 = "0.10"
blake3 = "1.5"
rand = "0.8"
hex = "0.4"
url = "2"
directories = "5"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tokio-socks = "0.5"

[target.'cfg(windows)'.dependencies]
flate2 = "1"
tar = "0.4"

